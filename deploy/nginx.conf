# 정적 프론트 + FastAPI 프록시. certbot --nginx 실행 시 443 블록은 자동 추가된다.
server {
    listen 80;
    server_name _;                       # 도메인으로 교체

    root /var/www/debate;                # frontend/dist 업로드 위치
    index index.html;

    client_max_body_size 2m;

    # SPA — 새로고침·딥링크가 index.html 로 떨어지도록
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 경로 (frontend/vite.config.js 의 프록시 목록과 동일하게 유지할 것)
    location ~ ^/(debate|topics|health|evaluation|sessions|survey|surveys) {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE(text/event-stream): 버퍼링을 끄지 않으면 발언이 실시간으로 안 나온다.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # AI 발언 생성이 길다 (실측 최대 164초). 기본 60초면 중간에 끊긴다.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
